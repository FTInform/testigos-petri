<style>

body{background-color:var(--plano);background-image:linear-gradient(var(--reticula) 1px,transparent 1px),linear-gradient(90deg,var(--reticula) 1px,transparent 1px);background-size:24px 24px;color:var(--trazo);font:17px/1.55 var(--txt);min-height:100vh}

.car{display:grid;grid-template-columns:auto minmax(0,2.4fr) minmax(0,1.4fr) repeat(3,minmax(68px,.7fr));border:1.5px solid var(--trazo);background:var(--plano2)}

.red{grid-area:red}
.marco{position:relative;background-color:var(--panel);padding:12px 14px;
 background-image:linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo)),linear-gradient(var(--trazo),var(--trazo));
 background-repeat:no-repeat;background-size:16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px;
 background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%}
.play:has(#extra:not([hidden])) .red svg{max-height:270px}
.red svg{display:block;width:100%;height:auto}
.est{display:flex;flex-wrap:wrap;gap:2px 18px;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(143,176,230,.45);padding-top:7px;margin-top:4px;font-size:.92rem}

.sheet{background:var(--hoja);color:var(--tinta);padding:22px 24px}
#task{grid-area:sheet;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;min-height:280px}

.bandeja{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:50px;border:1px dashed var(--tinta2);border-radius:26px;padding:6px 16px;margin:0 0 10px;font-family:var(--num)}

.fin{max-width:620px;margin:6vh auto 0;background:var(--hoja);color:var(--tinta);padding:30px;border:1.5px solid var(--trazo)}

.fin dl{display:grid;grid-template-columns:auto 1fr;gap:3px 20px;margin:18px 0}
.fin dt{color:var(--tinta2)}.fin dd{margin:0;font-family:var(--num)}

.fin .rate s{animation:cae .3s backwards}
.fin .rate s:nth-child(2){animation-delay:.14s}.fin .rate s:nth-child(3){animation-delay:.28s}
@keyframes cae{from{transform:scale(.3);opacity:0}}
.etapas{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:.95rem}

}
@media (prefers-reduced-motion:reduce){.temblor,.mas,.fin .rate s{animation:none}.mas{display:none}}

 pl:(q,sol,why,hint)=>n=>({kind:'multi',q,d:'Si no hay ninguna, no marques nada.',opts:pOpts(n),sol,why,hint}),
 tr:(q,sol,why,hint)=>n=>({kind:'multi',q,d:'Si no hay ninguna, no marques nada.',opts:tOpts(n),sol,why,hint}),
 vec:(q,sol,why,hint,lab)=>n=>({kind:'vector',q,labels:lab==='t'?tlab(n):plab(n),sol,why,hint}),
 cut:(M,kind,why)=>()=>({kind:'single',q:`Te salió ${cv(M)}. ¿Qué hacés?`,opts:[{v:'new',l:'Sigo expandiendo'},{v:'dup',l:'Corto: duplicado'},{v:'dead',l:'Corto: muerto'},{v:'omega',l:'Pongo ω'}],sol:kind,why,ok:why}),
 bag:(j,M)=>n=>{const nm=m=>{const a=[];m.forEach((v,i)=>{for(let k=0;k<v;k++)a.push(i);});return a;},to=nm(fire(n,M,j)),o=nm(M).map(i=>pid(n,i)).join(' ');
  return {kind:'bag',q:`Desde <code>${o}</code> se dispara <code>${tid(n,j)}</code>. ¿A qué estado llegás?`,d:'Tocá las plazas para escribir el estado. El orden no importa.',sol:to,check:v=>eq(v,to),why:whyFire(n,M,j),hint:`En números, el marcado de salida es ${cv(M)}.`};},
 mat:(f,q,why,hint,signed)=>n=>({kind:'matrix',signed:!!signed,q,sol:n[f],why,hint}),
 nums:(q,sol,why,hint)=>()=>({kind:'single',q,opts:numOpts(sol),sol,why,hint,show:v=>'<code>'+v+'</code>',ok:why})
};
const mx=(n,rows)=>`<table class="mini"><tr><th></th>${n.P.map(p=>`<th>${p.id}</th>`).join('')}</tr>${rows.map((r,j)=>`<tr><th>${n.T[j].id}</th>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
const IMP=[2,0,1,0];
const CURSO=[
{b:'Primero: las piezas',l:[
{id:'que',t:'Qué es una red de Petri',s:[
 {h:'Un juego de fichas',net:'lampara',t:`<p>Una red de Petri es un dibujo que muestra cómo funciona un sistema: qué cosas pueden pasar, qué hace falta para que pasen y qué cambia después.</p><p>Pensala como un juego de mesa muy simple. Hay cajas, fichas y acciones que mueven esas fichas.</p><p>Esta red es una lámpara. La ficha en la caja <code>apagada</code> te dice que ahora está apagada.</p>`},
 {h:'Probala',net:'lampara',play:1,t:`<p>Las rayitas amarillas son las acciones que se pueden hacer ahora. Tocá una y mirá qué pasa con la ficha.</p><p>Tocá varias veces. Fijate que nunca podés prender una lámpara que ya está prendida: la red no lo permite.</p>`},
 {h:'Para qué sirve',net:'torta',t:`<p>Se usa sobre todo cuando varias cosas ocurren a la vez o compiten por algo. Por ejemplo, dos personas que quieren la misma porción de torta, o dos programas que quieren usar la misma impresora.</p><p>Con el dibujo se puede analizar el sistema antes de construirlo y detectar problemas, como que todo se trabe.</p>`},
 {net:'lampara',M:[1,0],ask:Q.one('En la lámpara, ¿qué te dice una ficha dentro de una caja?',['Cómo está el sistema en este momento','Cuántas veces se usó la lámpara','Qué botón se apretó último'],0,'Las fichas muestran el estado actual del sistema.')}
]},
{id:'piezas',t:'Las cuatro piezas',pr:{net:'lampara',st:'disparo'},s:[
 {h:'Plazas y testigos',net:'impresora',t:`<p>Las <b>plazas</b> (o lugares) son los círculos. Representan una situación o un recurso, como <code>esperando</code> o <code>libre</code>.</p><p>Los <b>testigos</b> (también marcas o fichas) son los puntos. Si hay dos en <code>p1</code>, hay dos documentos esperando.</p>`},
 {h:'Transiciones y arcos',net:'impresora',t:`<p>Las <b>transiciones</b> son las rayitas. Representan una acción o evento, como <code>empezar</code>.</p><p>Los <b>arcos</b> son las flechas. Conectan siempre una plaza con una transición, o una transición con una plaza. Nunca dos plazas ni dos transiciones entre sí.</p>`},
 {h:'Entradas y salidas',net:'impresora',t:`<p>Mirá una transición y sus flechas:</p><ul><li>Las plazas que <b>le apuntan</b> son sus <b>entradas</b>: lo que la acción necesita.</li><li>Las plazas a las que <b>ella apunta</b> son sus <b>salidas</b>: lo que la acción produce.</li></ul><p>Para <code>t1</code>, las entradas son <code>p1</code> y <code>p3</code>: hace falta un documento y la impresora libre. Su salida es <code>p2</code>.</p>`},
 {net:'impresora',ask:Q.pl('¿Cuáles son las plazas de salida de t2?',[2,3],'Las flechas que salen de t2 llegan a p3 y p4.','Seguí las flechas que salen de la rayita t2.')},
 {net:'impresora',ask:Q.yn('¿Puede una flecha unir dos plazas directamente?',false,'Los arcos siempre unen una plaza con una transición, en cualquier sentido.')}
]},
{id:'hab',t:'Cuándo se puede disparar',pr:{net:'torta',st:'disparo'},s:[
 {h:'La regla',net:'impresora',M:IMP,t:`<p>Una transición está <b>habilitada</b> (o sensibilizada) si cada una de sus plazas de entrada tiene fichas suficientes.</p><p><code>t1</code> pide una ficha en <code>p1</code> y una en <code>p3</code>. Hay 2 y 1, así que está habilitada.</p><p><code>t2</code> pide una ficha en <code>p2</code>, y no hay ninguna. No está habilitada.</p>`},
 {h:'Solo miran las entradas',net:'impresora',M:IMP,t:`<p>Las salidas no importan para saber si una transición puede dispararse. Que una plaza de salida ya tenga fichas no la bloquea.</p><p>Tampoco alcanza con que <i>una</i> entrada tenga fichas: tienen que tenerlas <b>todas</b>.</p>`},
 {net:'impresora',M:IMP,ask:Q.en(IMP)},
 {net:'impresora',M:[1,1,0,0],t:'Ahora un documento se está imprimiendo.',ask:Q.en([1,1,0,0])},
 {net:'impresora',M:[0,0,1,2],t:'Ya se imprimieron los dos documentos.',ask:Q.en([0,0,1,2])}
]},
{id:'dis',t:'Qué pasa al disparar',pr:{net:'impresora',st:'disparo'},s:[
 {h:'Sacar y poner',net:'impresora',M:IMP,t:`<p>Disparar una transición habilitada es hacer dos cosas:</p><ol><li><b>Sacar</b> una ficha de cada plaza de entrada.</li><li><b>Poner</b> una ficha en cada plaza de salida.</li></ol><p>Solo cambian las plazas conectadas a esa transición. Las demás quedan igual.</p>`},
 {h:'Probalo',net:'impresora',play:1,t:`<p>Dispará hasta que no quede nada amarillo. Mirá cómo cambia la lista de números debajo del dibujo.</p>`},
 {h:'Las fichas no viajan',net:'impresora',M:IMP,t:`<p>Es lo que más confunde: las fichas no se mueven de una caja a otra. Se borran unas y se crean otras.</p><p>Por eso la cantidad total puede cambiar. Al disparar <code>t1</code> se sacan 2 fichas y se pone 1: el total baja de 3 a 2.</p><p>Si hay varias habilitadas, se dispara <b>una por vez</b> y puede ser cualquiera.</p>`},
 {net:'impresora',M:IMP,ask:Q.fire(0,IMP)},
 {net:'impresora',M:[1,1,0,0],ask:Q.fire(1,[1,1,0,0])}
]},
{id:'peso',t:'Flechas con peso',pr:{net:'sandwich',st:'disparo'},s:[
 {h:'Un número en la flecha',net:'sandwich',t:`<p>Una flecha puede llevar un número: su <b>peso</b>. Significa que esa flecha mueve esa cantidad de fichas. Sin número, pesa 1.</p><p>Armar un sándwich pide 2 panes y 1 feta. La flecha desde <code>pan</code> pesa 2.</p>`},
 {h:'Cambia la regla, pero poco',net:'sandwich',t:`<p><b>Para habilitar:</b> cada entrada debe tener al menos tantas fichas como el peso de su flecha. Con 1 solo pan no alcanza.</p><p><b>Al disparar:</b> se saca el peso de cada flecha de entrada y se pone el peso de cada flecha de salida.</p>`},
 {net:'sandwich',M:[1,2,0],t:'Queda un solo pan.',ask:Q.en([1,2,0])},
 {net:'sandwich',M:[4,2,0],ask:Q.fire(0,[4,2,0])},
 {net:'canje',M:[0,1],t:'Devolver el premio te da 2 cupones.',ask:Q.fire(1,[0,1])}
]},
{id:'marc',t:'El marcado: la foto del momento',pr:{net:'torta',st:'disparo'},s:[
 {h:'Una lista de números',net:'impresora',M:IMP,t:`<p>El <b>marcado</b> dice cuántas fichas hay en cada plaza en un instante. Define el estado de la red.</p><p>Se escribe como una lista en orden p1, p2, p3…: <code>(2 0 1 0)</code> significa 2 en p1, 0 en p2, 1 en p3 y 0 en p4.</p><p>El marcado con el que empezás se llama <b>M0</b> (marcado inicial).</p>`},
 {net:'llave',M:[1,0,1,0,1],ask:Q.vec('Mirá el dibujo. ¿Cuál es el marcado?',[1,0,1,0,1],'Contá las fichas de cada plaza, en orden de p1 a p5.','Si una plaza está vacía, va 0.')},
 {h:'Alcanzable',net:'impresora',M:IMP,t:`<p>Un marcado es <b>inmediatamente alcanzable</b> si llegás a él con un solo disparo.</p><p>Es <b>alcanzable</b> si llegás con una secuencia de disparos, de cualquier largo.</p><p>Al conjunto de todos los marcados alcanzables desde M0 se lo llama <b>R(M0)</b>.</p>`},
 {net:'impresora',M:IMP,ask:Q.yn('Desde (2 0 1 0), ¿(1 1 0 0) es inmediatamente alcanzable?',true,'Se llega disparando solo t1.')},
 {net:'impresora',M:IMP,ask:Q.yn('Desde (2 0 1 0), ¿(0 1 0 1) es inmediatamente alcanzable?',false,'Hacen falta tres disparos: t1, t2 y t1. Es alcanzable, pero no inmediatamente.')}
]},
{id:'casos',t:'Varias a la vez y casos especiales',pr:{net:'cola',st:'disparo'},s:[
 {h:'Una ficha, un solo uso',net:'torta',M:[1,0,0],t:`<p>Las fichas son indivisibles: una ficha la puede usar una sola transición.</p><p>En la torta, <code>t1</code> y <code>t2</code> están habilitadas, pero hay una sola porción. Si come Ana, Beto ya no puede. Eso es un <b>conflicto</b>.</p>`},
 {net:'torta',M:[0,1,0],t:'Ana ya comió.',ask:Q.en([0,1,0])},
 {h:'A veces no se molestan',net:'cinco',M:[0,0,1,1,0],t:`<p>Acá <code>t3</code> y <code>t4</code> están habilitadas y usan fichas distintas. Podés disparar cualquiera sin afectar a la otra.</p><p>Eso es <b>concurrencia</b>: las dos pueden ocurrir, en el orden que sea.</p>`},
 {h:'Fuente y sumidero',net:'cola',t:`<p>Una transición sin entradas se llama <b>fuente</b>. No pide nada, así que siempre está habilitada. En la cola, <code>t1</code> hace llegar clientes.</p><p>Una transición sin salidas se llama <b>sumidero</b>. Solo elimina fichas. En la cola, <code>t2</code> atiende y el cliente se va.</p>`},
 {net:'cola',M:[0],ask:Q.en([0])}
]}
]},
{b:'Después: el árbol de alcanzabilidad',l:[
{id:'arb1',t:'Cómo se arma un árbol',pr:{net:'impresora',st:'arbol'},s:[
 {h:'Todo lo que puede pasar',net:'impresora',M:IMP,tree:0,t:`<p>El árbol de alcanzabilidad es un dibujo de todos los marcados a los que se puede llegar.</p><p>Cada caja es un marcado. Cada flecha lleva el nombre de la transición que se disparó.</p><p>Arranca con una sola caja: M0.</p>`},
 {h:'Paso 1',net:'impresora',M:IMP,tree:1,t:`<p>Desde <code>2010</code> solo está habilitada <code>t1</code>. La disparás y te da <code>1100</code>. Dibujás la flecha y la caja nueva.</p>`},
 {h:'Paso 2',net:'impresora',M:[1,1,0,0],tree:2,t:`<p>Desde <code>1100</code>: <code>t1</code> ya no puede, porque la impresora está ocupada. Solo <code>t2</code> puede, y da <code>1011</code>.</p>`},
 {net:'impresora',M:[1,0,1,1],tree:2,ask:Q.fire(0,[1,0,1,1])},
 {h:'Hasta el final',net:'impresora',M:[0,0,1,2],tree:4,t:`<p>Repetís lo mismo hasta que no quede nada por hacer. En <code>0012</code> no hay documentos y no se puede disparar nada: la rama termina.</p><p>Eso es todo el método: <b>mirar qué se puede disparar, disparar, dibujar, repetir</b>.</p>`}
]},
{id:'arb2',t:'Cuando el árbol se abre',pr:{net:'torta',st:'arbol'},s:[
 {h:'Una rama por transición',net:'torta',M:[1,0,0],tree:9,t:`<p>Si un marcado habilita dos transiciones, salen dos ramas.</p><p>Cada rama es una historia distinta: una en la que come Ana y otra en la que come Beto.</p>`},
 {h:'El error más común',net:'cinco',M:[0,1,1,0,0],tree:3,t:`<p>Las dos ramas salen del <b>mismo marcado</b>. No dispares una y después sigas desde el resultado para sacar la otra.</p><p>Desde <code>01100</code> disparás <code>t2</code> y anotás <code>00110</code>. Volvés a <code>01100</code>, disparás <code>t3</code> y anotás <code>01001</code>.</p>`},
 {net:'cinco',M:[0,0,1,1,0],tree:3,ask:Q.nums('Desde (0 0 1 1 0), ¿cuántas ramas salen?',2,'Están habilitadas t3 y t4: una rama por cada una.','Contá las transiciones habilitadas.')},
 {h:'En qué orden',net:'cinco',M:[0,1,1,0,0],tree:3,t:`<p>Conviene expandir <b>por niveles</b>: primero todos los marcados de un nivel, de izquierda a derecha, y recién después el nivel siguiente.</p><p>Así no te perdés, y queda claro qué apareció primero.</p>`}
]},
{id:'arb3',t:'Cuándo cortar una rama',pr:{net:'lampara',st:'arbol'},s:[
 {h:'El árbol podría no terminar',net:'lampara',M:[1,0],tree:9,t:`<p>La lámpara se puede prender y apagar para siempre. Si siguiéramos, el árbol sería infinito. Por eso se corta una rama cuando llegás a un <b>marcado frontera</b>.</p><p>Hay tres tipos. Los dos primeros son estos:</p><ul><li><b>Muerto:</b> no hay ninguna transición habilitada.</li><li><b>Duplicado:</b> ese marcado ya apareció en el árbol.</li></ul>`},
 {net:'lampara',M:[1,0],tree:1,ask:Q.cut([1,0],'dup','(1 0) ya está en el árbol: es M0. Se corta como duplicado.')},
 {net:'impresora',M:[0,0,1,2],tree:3,ask:Q.cut([0,0,1,2],'dead','Es nuevo, pero no habilita ninguna transición: está muerto.')},
 {net:'impresora',M:[1,1,0,0],tree:0,ask:Q.cut([1,1,0,0],'new','Es nuevo y habilita t2, así que hay que seguir.')},
 {h:'Duplicado vale aunque esté en otra rama',net:'cinco',tree:9,t:`<p>Se corta si el marcado aparece en <b>cualquier parte</b> del árbol, no solo arriba en su rama.</p><p>En esta red, <code>00011</code> aparece primero en una rama. Cuando vuelve a salir en otra, se corta ahí. Las cajas punteadas son duplicados.</p><p>El orden para revisar cada marcado nuevo: ¿ya apareció? ¿Crece? ¿Está muerto? Si no es nada de eso, seguís.</p>`}
]},
{id:'arb4',t:'El símbolo ω',pr:{net:'alcancia',st:'arbol'},s:[
 {h:'Cuando las fichas crecen sin fin',net:'alcancia',M:[1,0,0],tree:0,t:`<p>En la alcancía, cada vuelta deja una moneda en <code>p3</code>. Nunca se repite un marcado, porque siempre hay una moneda más. Sin una regla extra, el árbol sería infinito.</p><p>Esa regla es el tercer tipo de corte.</p>`},
 {h:'La regla',net:'alcancia',M:[1,0,1],tree:2,t:`<p>Desde <code>100</code> llegamos a <code>010</code>, y desde ahí a <code>101</code>.</p><p><code>101</code> es igual a su antepasado <code>100</code> salvo que tiene <b>más fichas</b> en una plaza, y además <b>habilita las mismas transiciones</b>. Ese ciclo se puede repetir siempre.</p><p>Entonces, en esa plaza se escribe <b>ω</b>, que significa "tantas como quieras". Queda <code>10ω</code>.</p>`},
 {net:'alcancia',M:[1,0,1],tree:1,ask:Q.cut([1,0,1],'omega','Tiene más fichas que su antepasado (1 0 0) y habilita lo mismo.')},
 {h:'Cómo se sigue con ω',net:'alcancia',M:[1,0,Infinity],tree:9,t:`<p>ω más o menos cualquier número sigue siendo ω.</p><p><code>10ω</code> con <code>t1</code> da <code>01ω</code>, y con <code>t2</code> vuelve a <code>10ω</code>, que es un duplicado. Listo: el árbol es finito.</p>`},
 {h:'Tienen que habilitar lo mismo',net:'cola',M:[1],tree:9,t:`<p>En la cola, <code>0</code> pasa a <code>1</code>. Aunque creció, <code>0</code> habilita solo <code>t1</code> y <code>1</code> habilita <code>t1</code> y <code>t2</code>: no habilitan lo mismo, así que todavía no va ω.</p><p>Después, <code>1</code> pasa a <code>2</code>, y los dos habilitan <code>t1</code> y <code>t2</code>. Ahí sí: ω.</p>`},
 {net:'alcancia',M:[0,1,Infinity],tree:3,ask:Q.vec('Desde (0 1 ω) disparás t2. ¿Qué marcado queda?',[1,0,Infinity],'p2 pierde 1, p1 gana 1, y ω + 1 sigue siendo ω.','Podés escribir w en lugar de ω.')}
]},
{id:'arb5',t:'Un árbol completo, paso a paso',pr:{net:'cinco',st:'arbol'},s:[
 {h:'La red',net:'cinco',M:[1,0,0,0,0],tree:0,t:`<p>Vamos a armar el árbol de esta red, nivel por nivel. Antes de arrancar, anotá de cada transición qué saca y qué pone:</p><table class="mini"><tr><th></th><th>saca</th><th>pone</th></tr><tr><th>t1</th><td>p1</td><td>p2 p3</td></tr><tr><th>t2</th><td>p2</td><td>p4</td></tr><tr><th>t3</th><td>p3</td><td>p5</td></tr><tr><th>t4</th><td>p4</td><td>p2</td></tr><tr><th>t5</th><td>p4 p5</td><td>p1</td></tr></table>`},
 {h:'Niveles 1 y 2',net:'cinco',M:[0,1,1,0,0],tree:3,t:`<p><code>10000</code> solo habilita <code>t1</code>, que da <code>01100</code>.</p><p><code>01100</code> habilita <code>t2</code> y <code>t3</code>. Salen dos ramas: <code>00110</code> y <code>01001</code>. Las dos son nuevas.</p>`},
 {h:'Nivel 3',net:'cinco',M:[0,0,1,1,0],tree:6,t:`<p><code>00110</code> habilita <code>t3</code> y <code>t4</code>:</p><ul><li><code>t3</code> da <code>00011</code>, nuevo.</li><li><code>t4</code> da <code>01100</code>, duplicado. Se corta.</li></ul><p><code>01001</code> habilita solo <code>t2</code>, que da <code>00011</code>: ya salió recién, duplicado.</p>`},
 {net:'cinco',M:[0,0,0,1,1],tree:6,ask:Q.en([0,0,0,1,1])},
 {h:'Nivel 4',net:'cinco',M:[0,0,0,1,1],tree:9,t:`<p><code>00011</code> habilita <code>t4</code> y <code>t5</code>. Dan <code>01001</code> y <code>10000</code>, los dos duplicados.</p><p>No queda nada por expandir. La red tiene <b>5 marcados distintos</b>.</p><p>Ahora hacelo vos desde cero en la práctica.</p>`}
]}
]},
{b:'La máquina de testigos',l:[
{id:'mt1',t:'Cómo se escriben los estados',pr:{net:'lampara',st:'mt'},s:[
 {h:'Otra forma de escribir',net:'impresora',M:IMP,t:`<p>La máquina de testigos es una versión más compacta del árbol.</p><p>En lugar de escribir todos los números, cada estado se escribe con los <b>nombres de las plazas que tienen fichas</b>.</p><p><code>(0 1 0 1)</code> se escribe <code>p2 p4</code>.</p>`},
 {h:'Si hay dos fichas, va dos veces',net:'impresora',M:IMP,t:`<p>El nombre se repite tantas veces como fichas tenga la plaza.</p><p><code>(2 0 1 0)</code> se escribe <code>p1 p1 p3</code>.</p><p>Las plazas vacías no se escriben. Por eso conviene cuando hay muchas plazas y pocas fichas.</p>`},
 {net:'impresora',M:[1,1,0,0],ask:Q.bag(1,[1,1,0,0])},
 {net:'impresora',M:[0,1,0,1],ask:Q.bag(1,[0,1,0,1])}
]},
{id:'mt2',t:'Del árbol a la máquina',pr:{net:'cinco',st:'mt'},s:[
 {h:'Cada estado una sola vez',net:'lampara',M:[1,0],mt:9,t:`<p>La máquina es un grafo: estados en óvalos y flechas con el nombre de la transición.</p><p>A diferencia del árbol, <b>cada estado se dibuja una sola vez</b>. Donde el árbol tenía un duplicado, acá la flecha vuelve al óvalo que ya existe.</p>`},
 {h:'El mismo contenido',net:'impresora',M:IMP,tree:9,mt:9,t:`<p>El árbol y la máquina muestran lo mismo: los mismos estados y las mismas flechas.</p><p>Si ya hiciste el árbol, la máquina sale casi directo: escribí un óvalo por cada marcado distinto y una flecha por cada flecha del árbol.</p>`},
 {h:'Con ramas y ciclos',net:'cinco',M:[1,0,0,0,0],mt:9,t:`<p>El árbol de esta red tenía 8 flechas y 5 marcados distintos. La máquina tiene 5 óvalos y 8 flechas.</p><p>Contar las flechas te sirve para comprobar que no te falte ninguna.</p>`},
 {net:'cinco',M:[0,0,0,1,1],mt:9,ask:Q.bag(4,[0,0,0,1,1])},
 {h:'Una aclaración',net:'alcancia',M:[1,0,0],t:`<p>La máquina de testigos nombra plazas con una cantidad concreta de fichas. En esta práctica se usa solo con redes limitadas, es decir, sin ω.</p>`}
]}
]},
{b:'Las propiedades',l:[
{id:'p1',t:'Limitación',pr:{net:'buffer',st:'props'},s:[
 {h:'¿Cuántas fichas puede llegar a tener?',net:'impresora',M:IMP,tree:9,t:`<p>Una red es <b>k-limitada</b> si ninguna plaza llega a tener más de k fichas en ningún marcado alcanzable.</p><p>Se busca el número más grande en todo el árbol. Acá el máximo es 2, así que es <b>2-limitada</b>.</p><p>Si el máximo es 1, es 1-limitada. Importa porque una red limitada se puede implementar con recursos finitos.</p>`},
 {h:'Si aparece ω',net:'alcancia',tree:9,t:`<p>Si el árbol tiene una ω, alguna plaza crece sin fin. La red <b>no es limitada</b>.</p>`},
 {net:'sandwich',M:[4,2,0],tree:9,ask:Q.nums('¿Para qué valor de k es k-limitada esta red?',4,'El número más grande que aparece en el árbol es 4, en p1.','Mirá todos los números del árbol.')}
]},
{id:'p2',t:'Vivacidad y bloqueos',pr:{net:'cruzadas',st:'props'},s:[
 {h:'¿Se puede trabar?',net:'cruzadas',tree:9,t:`<p>Un <b>marcado muerto</b> es uno donde no se puede disparar nada: el sistema se trabó.</p><p>En esta red, cada proceso agarra una llave y espera la otra. Es un bloqueo clásico. Son las hojas que dicen "muerto".</p>`},
 {h:'Red viva',net:'llave',mt:9,t:`<p>Una transición es <b>viva</b> si, desde cualquier marcado alcanzable, siempre existe alguna forma de volver a habilitarla.</p><p>Una red es <b>viva</b> si todas sus transiciones lo son.</p><p>En la máquina: desde cada óvalo tenés que poder llegar a una flecha de cada transición. Acá se cumple.</p>`},
 {h:'Si hay un marcado muerto, no es viva',net:'impresora',mt:9,t:`<p>Si la red llega a un marcado muerto, desde ahí no se puede habilitar nada, así que <b>no es viva</b>.</p><p>La vivacidad sirve justamente para detectar bloqueos totales o parciales.</p>`},
 {net:'llave',mt:9,ask:(n=>Q.yn('¿Esta red es viva?',true,'No tiene marcados muertos, y desde cada estado se puede llegar a disparar cualquier transición.')(n))},
 {net:'torta',tree:9,ask:Q.yn('¿Esta red es viva?',false,'Después de que alguien come, nada puede dispararse: hay marcados muertos.')}
]},
{id:'p3',t:'Ciclicidad',pr:{net:'buffer',st:'props'},s:[
 {h:'¿Puedo volver al principio?',net:'lampara',mt:9,t:`<p>Una red es <b>cíclica</b> si desde <b>cualquier</b> marcado alcanzable se puede volver a M0.</p><p>En la máquina: desde cada óvalo tiene que haber un camino hasta el óvalo inicial.</p><p>La lámpara lo cumple.</p>`},
 {h:'No es lo mismo que viva',net:'impresora',mt:9,t:`<p>La vivacidad pregunta por las <b>transiciones</b>. La ciclicidad pregunta por <b>volver a M0</b>. Se analizan por separado.</p><p>La impresora no es cíclica: los documentos impresos no vuelven a esperar.</p>`},
 {net:'cinco',mt:9,ask:Q.yn('¿Esta red es cíclica?',true,'Desde cualquier estado se llega a p4 p5 y de ahí t5 vuelve a p1.')},
 {net:'cruzadas',tree:9,ask:Q.yn('¿Esta red es cíclica?',false,'Sus marcados finales no tienen ningún camino de regreso.')}
]},
{id:'p4',t:'Conservación',pr:{net:'canje',st:'props'},s:[
 {h:'¿Se mantiene el total?',net:'lampara',mt:9,t:`<p>La <b>conservación estricta</b> pregunta si el número total de fichas es siempre el mismo. Sumás las fichas de cada marcado.</p><p>En la lámpara siempre hay 1. Se conserva.</p>`},
 {net:'impresora',tree:9,ask:Q.yn('¿La impresora tiene conservación estricta?',false,'Los totales son 3, 2, 3, 2, 3: cambian.','Sumá cada marcado del árbol.')},
 {h:'Conservación con pesos',net:'impresora',M:IMP,t:`<p>A veces cada plaza "vale" distinto. Se busca un vector de pesos <code>w</code>, con todos sus valores positivos, tal que el valor total no cambie.</p><p>La condición: en cada transición, el valor de lo que entra es igual al valor de lo que sale.</p><ul><li><code>t1</code>: <code>w1 + w3 = w2</code></li><li><code>t2</code>: <code>w2 = w3 + w4</code></li></ul><p>Elegís <code>w1 = 1</code> y <code>w3 = 1</code>. Sale <code>w2 = 2</code> y <code>w4 = 1</code>. Entonces <code>w = (1 2 1 1)</code>.</p>`},
 {h:'Comprobalo',net:'impresora',M:IMP,t:`<p>Multiplicá cada marcado por los pesos y sumá:</p><ul><li><code>(2 0 1 0)</code>: 2 + 1 = 3</li><li><code>(1 1 0 0)</code>: 1 + 2 = 3</li><li><code>(0 0 1 2)</code>: 1 + 2 = 3</li></ul><p>Da siempre 3. La impresora conserva con esos pesos.</p>`},
 {net:'canje',M:[2,0],ask:n=>({kind:'vector',q:'Encontrá un vector w con valores positivos que conserve esta red.',d:'t1: lo que entra vale 2·w1 y lo que sale vale w2.',labels:plab(n),sol:[1,2],check:v=>v.every(x=>x>0&&x!==Infinity)&&n.C.every(r=>r.reduce((a,c,i)=>a+c*v[i],0)===0),show:v=>'por ejemplo '+cv(v),why:'Tiene que cumplirse 2·w1 = w2.',hint:'Probá con w1 = 1 y despejá w2.'})}
]},
{id:'p5',t:'Conflicto',pr:{net:'llave',st:'props'},s:[
 {h:'Conflicto estructural',net:'torta',t:`<p>Hay <b>conflicto estructural</b> cuando una plaza alimenta a más de una transición. Se ve directamente en el dibujo: de un círculo salen dos o más flechas.</p><p>Acá <code>p1</code> alimenta a <code>t1</code> y a <code>t2</code>.</p>`},
 {net:'llave',ask:Q.pl('¿Qué plazas tienen conflicto estructural?',[2],'De p3, la llave, salen flechas a t1 y t3.','Contá las flechas que salen de cada círculo.')},
 {h:'Conflicto efectivo',net:'cinco',M:[0,0,0,1,1],t:`<p>El <b>conflicto efectivo</b> depende del marcado. Dos transiciones lo tienen si:</p><ol><li>Existe un marcado alcanzable que habilita a las dos.</li><li>Al dispararse una, el marcado que queda no habilita a la otra.</li></ol><p>En <code>00011</code>, <code>t4</code> y <code>t5</code> usan la misma ficha de <code>p4</code>: la que se dispare primero le saca la posibilidad a la otra.</p>`},
 {net:'cinco',M:[0,0,1,1,0],ask:Q.yn('En (0 0 1 1 0), t3 y t4 están habilitadas. ¿Están en conflicto efectivo?',false,'No comparten entradas: t3 usa p3 y t4 usa p4. Es concurrencia.')},
 {net:'cinco',M:[0,0,0,1,1],ask:Q.yn('En (0 0 0 1 1), t4 y t5 están habilitadas. ¿Están en conflicto efectivo?',true,'Las dos necesitan la ficha de p4.')}
]},
{id:'p6',t:'Exclusión mutua',pr:{net:'llave',st:'props'},s:[
 {h:'Plazas que nunca coinciden',net:'llave',mt:9,t:`<p>Dos plazas están en <b>exclusión mutua</b> si nunca tienen fichas al mismo tiempo en los marcados alcanzables desde M0.</p><p>Acá <code>p2</code> (A adentro) y <code>p4</code> (B adentro) nunca coinciden: hay una sola llave. Es justamente lo que se quería lograr.</p>`},
 {net:'impresora',tree:9,ask:Q.yn('¿p2 y p3 están en exclusión mutua?',true,'La impresora no puede estar imprimiendo y libre a la vez: ningún marcado tiene fichas en las dos.','Buscá un marcado con fichas en p2 y en p3.')},
 {net:'cinco',tree:9,ask:Q.yn('¿p2 y p3 están en exclusión mutua?',false,'En (0 1 1 0 0) las dos tienen fichas.')},
 {h:'Transiciones',net:'torta',M:[1,0,0],t:`<p>Un conjunto de transiciones es <b>mutuamente exclusivo</b> si, al dispararse cualquiera, las demás quedan deshabilitadas.</p><p>En la torta, <code>t1</code> y <code>t2</code> lo son: cuando come una persona, la otra ya no puede.</p>`}
]},
{id:'p7',t:'Tipos y subclases de redes',pr:{net:'buffer',st:'props'},s:[
 {h:'Ordinaria, generalizada, pura',net:'enzima',t:`<ul><li><b>Ordinaria:</b> todos los arcos pesan 1.</li><li><b>Generalizada:</b> puede tener cualquier peso entero.</li><li><b>Pura:</b> ninguna plaza es a la vez entrada y salida de la misma transición.</li></ul><p>La enzima no es pura: <code>p2</code> es entrada y salida de <code>t1</code>.</p>`},
 {net:'sandwich',ask:Q.yn('¿Esta red es ordinaria?',false,'La flecha desde pan pesa 2: es generalizada.')},
 {h:'Máquina de estados y grafo marcado',net:'lampara',t:`<p><b>Máquina de estados:</b> cada <b>transición</b> tiene exactamente 1 entrada y 1 salida. Puede representar conflictos, pero no paralelismo.</p><p><b>Grafo marcado:</b> cada <b>plaza</b> tiene exactamente 1 entrada y 1 salida. Puede representar paralelismo y sincronización, pero no conflicto.</p><p>La lámpara cumple las dos.</p>`},
 {net:'torta',ask:n=>Q.yn('¿Es máquina de estados?',subclases(n).me,'Cada transición tiene 1 entrada y 1 salida.')()},
 {net:'torta',ask:n=>Q.yn('¿Es grafo marcado?',subclases(n).gm,'p1 tiene dos salidas, y además ninguna entrada.')()},
 {h:'Libre elección y simple',net:'llave',t:`<p><b>Libre elección:</b> si una plaza alimenta a varias transiciones, tiene que ser la <b>única entrada</b> de todas ellas.</p><p><b>Simple:</b> cada transición tiene como máximo <b>una</b> entrada compartida con otra transición.</p><p>Acá <code>p3</code> alimenta a <code>t1</code> y <code>t3</code>, pero <code>t1</code> también usa <code>p1</code>. No es de libre elección. Sí es simple: cada transición tiene una sola entrada compartida, <code>p3</code>.</p>`},
 {net:'torta',ask:n=>Q.yn('¿Es de libre elección?',subclases(n).rle,'p1 alimenta a dos transiciones y es la única entrada de ambas.')()}
]}
]},
{b:'El método matricial',l:[
{id:'f1',t:'La red escrita en matemática',pr:{net:'lampara',st:'matriz'},s:[
 {h:'La definición formal',net:'impresora',t:`<p>Una red de Petri se define como <code>RdP = (P, T, I, O)</code>:</p><ul><li><code>P</code>: las plazas.</li><li><code>T</code>: las transiciones.</li><li><code>I(p,t)</code>: cuántos arcos van de la plaza p a la transición t.</li><li><code>O(t,p)</code>: cuántos arcos van de la transición t a la plaza p.</li></ul><p>Si le sumás el marcado inicial, es una <b>red marcada</b>: <code>(RdP, M0)</code>.</p>`},
 {h:'Es lo mismo de antes',net:'impresora',t:`<p>La fórmula del disparo dice lo que ya sabés:</p><p><code>M'(p) = M(p) + O(t,p) − I(p,t)</code></p><p>El marcado nuevo es lo que había, más lo que pone la transición, menos lo que saca.</p><p>Si no hay flecha, vale 0: <code>I(p2,t1) = 0</code>.</p>`},
 {net:'sandwich',ask:Q.nums('¿Cuánto vale I(p1, t1)?',2,'De p1 a t1 hay una flecha de peso 2.','Mirá el peso de la flecha que va de p1 a t1.')},
 {net:'impresora',ask:Q.nums('¿Cuánto vale O(t2, p4)?',1,'De t2 sale una flecha sin número hacia p4: pesa 1.')}
]},
{id:'f2',t:'Las matrices C<sup>−</sup> y C<sup>+</sup>',pr:{net:'torta',st:'matriz'},s:[
 {h:'Una tabla',net:'impresora',t:n=>`<p>Las matrices son la misma tabla de "qué saca y qué pone", con números.</p><p><b>Filas: transiciones. Columnas: plazas.</b> Respetá ese orden, porque muchas páginas lo hacen al revés.</p><p><b>C<sup>−</sup> (previa)</b> dice cuánto saca cada transición de cada plaza:</p>${mx(n,n.pre)}`},
 {h:'Cómo leerla',net:'impresora',t:n=>`<p>Fila <code>t1</code>, columna <code>p1</code>: ¿hay flecha de p1 a t1? Sí, pesa 1. Va un 1.</p><p>Fila <code>t2</code>, columna <code>p1</code>: ¿hay flecha de p1 a t2? No. Va un 0.</p><p><b>C<sup>+</sup> (posterior)</b> dice cuánto pone cada transición en cada plaza:</p>${mx(n,n.post)}`},
 {net:'lampara',ask:Q.mat('pre','Completá C<sup>−</sup> de la lámpara.','Mirá las flechas que entran a cada transición.','Fila t, columna p: el peso de la flecha de p hacia t.')},
 {net:'lampara',ask:Q.mat('post','Completá C<sup>+</sup> de la lámpara.','Mirá las flechas que salen de cada transición.','Fila t, columna p: el peso de la flecha de t hacia p.')}
]},
{id:'f3',t:'La matriz de incidencia C',pr:{net:'impresora',st:'matriz'},s:[
 {h:'El cambio neto',net:'impresora',t:n=>`<p><code>C = C<sup>+</sup> − C<sup>−</sup></code>, casillero por casillero. Cada fila dice cómo cambia el marcado cuando se dispara esa transición.</p>${mx(n,n.C)}<p>Fila <code>t1</code>: p1 pierde 1, p2 gana 1, p3 pierde 1, p4 no cambia.</p>`},
 {h:'Una trampa',net:'enzima',t:n=>`<p>Si una plaza es entrada y salida de la misma transición, se cancela y da 0:</p>${mx(n,n.C)}<p><code>p2</code> da 0, pero la enzima sí hace falta para disparar. Por eso C sola no describe toda la red, y la habilitación se controla con C<sup>−</sup>.</p>`},
 {net:'torta',ask:Q.mat('C','Completá C de la torta.','Restá lo que saca a lo que pone.','Tocar la celda alterna 0, 1, −1, 2, −2.',true)}
]},
{id:'f4',t:'Habilitar y disparar con matrices',pr:{net:'cinco',st:'matriz'},s:[
 {h:'El vector ej',net:'impresora',M:IMP,t:`<p><code>ej</code> representa a la transición j: una lista con un 1 en el lugar j y 0 en el resto. En esta red, <code>e1 = (1 0)</code> y <code>e2 = (0 1)</code>.</p><p>La ventaja: <code>ej·C<sup>−</sup></code> es directamente la <b>fila j</b> de C<sup>−</sup>. No hay que hacer ninguna cuenta rara.</p>`},
 {h:'¿Está habilitada?',net:'impresora',M:IMP,t:`<p>La condición es <code>M ≥ ej·C<sup>−</sup></code>, comparando posición por posición.</p><p><code>t1</code> en M0: <code>(2 0 1 0) ≥ (1 0 1 0)</code>. Se cumple en todas: habilitada.</p><p><code>t2</code> en M0: <code>(2 0 1 0) ≥ (0 1 0 0)</code>. En p2 da 0 ≥ 1, que es falso: no habilitada.</p>`},
 {net:'impresora',M:[1,1,0,0],ask:Q.yn('Con M = (1 1 0 0), ¿se cumple M ≥ e1·C<sup>−</sup>?',false,'e1·C<sup>−</sup> = (1 0 1 0). En p3 falla: 0 no es mayor o igual que 1.')},
 {h:'Disparar',net:'impresora',M:IMP,t:`<p><code>M' = M + ej·C</code>: sumás a M la fila j de C.</p><p><code>(2 0 1 0) + (−1 1 −1 0) = (1 1 0 0)</code></p><p>Da lo mismo que disparar a mano.</p>`},
 {net:'impresora',M:[1,1,0,0],ask:Q.vec('Calculá M + e2·C con M = (1 1 0 0).',[1,0,1,1],'Sumá la fila t2 de C, que es (0 −1 1 1).','Sumá posición por posición.')}
]},
{id:'f5',t:'Secuencias: el vector f',pr:{net:'cinco',st:'matriz'},s:[
 {h:'Varios disparos en una cuenta',net:'impresora',M:IMP,t:`<p>Para una secuencia σ se usa el <b>vector de disparo</b> <code>f(σ)</code>: cuenta cuántas veces se dispara cada transición.</p><p>La secuencia <code>t1 t2 t1</code> tiene <code>f = (2 1)</code>: dos veces t1 y una vez t2.</p><p>La fórmula es <code>M' = M0 + f·C</code>.</p>`},
 {h:'Cómo se hace f·C',net:'impresora',M:IMP,t:`<p>Tomás cada fila de C tantas veces como diga f, y sumás.</p><p><code>2·(−1 1 −1 0) + 1·(0 −1 1 1) = (−2 1 −1 1)</code></p><p>Después: <code>(2 0 1 0) + (−2 1 −1 1) = (0 1 0 1)</code>.</p><p>Es el mismo <code>0101</code> que da el árbol.</p>`},
 {net:'impresora',M:IMP,ask:Q.vec('Para la secuencia t1 t2, ¿cuánto vale f?',[1,1],'t1 aparece una vez y t2 una vez.','Contá las apariciones.','t')},
 {net:'impresora',M:IMP,ask:Q.vec('Con f = (2 2), calculá M0 + f·C.',[0,0,1,2],'f·C = (−2 0 0 2). Sumado a (2 0 1 0) da (0 0 1 2).','Primero calculá f·C.')},
 {h:'f no guarda el orden',net:'impresora',M:IMP,t:`<p><code>f</code> dice cuántas veces, pero no en qué orden. Antes de usar la fórmula, comprobá que cada disparo esté habilitado cuando le toca.</p><p>Por ejemplo, <code>t2 t1 t1</code> también tiene <code>f = (2 1)</code>, pero no se puede hacer: <code>t2</code> no está habilitada en M0.</p>`}
]},
{id:'f6',t:'¿Se puede llegar a un marcado?',pr:{net:'cinco',st:'matriz'},s:[
 {h:'La pregunta al revés',net:'impresora',M:IMP,t:`<p>Te dan un marcado M y te preguntan si se puede llegar. Planteás <code>f = (a b)</code> y resolvés <code>M0 + f·C = M</code>.</p><p>Cada <b>columna</b> de C da una ecuación:</p><ul><li>p1: <code>2 − a</code></li><li>p2: <code>a − b</code></li><li>p3: <code>1 − a + b</code></li><li>p4: <code>b</code></li></ul>`},
 {h:'Con solución',net:'impresora',M:IMP,t:`<p>¿Se llega a <code>(1 0 1 1)</code>?</p><ul><li>p1: <code>2 − a = 1</code>, así que a = 1.</li><li>p4: <code>b = 1</code>.</li><li>p2: <code>1 − 1 = 0</code>. Se cumple.</li><li>p3: <code>1 − 1 + 1 = 1</code>. Se cumple.</li></ul><p>Solución: <code>f = (1 1)</code>, o sea <code>t1 t2</code>.</p>`},
 {h:'Sin solución',net:'impresora',M:IMP,t:`<p>¿Se llega a <code>(1 1 1 0)</code>?</p><ul><li>p1: a = 1.</li><li>p4: b = 0.</li><li>p3: <code>1 − 1 + 0 = 0</code>, pero tenía que dar 1.</li></ul><p>Contradicción: no tiene solución, así que <b>no se puede llegar</b>.</p>`},
 {net:'impresora',M:IMP,ask:n=>({kind:'vector',q:'Resolvé M0 + f·C = (0 1 0 1).',labels:tlab(n),sol:[2,1],why:'p1 da a = 2 y p4 da b = 1.',hint:'Usá las ecuaciones de p1 y p4.',alt:{l:'No tiene solución',v:'none'}})},
 {net:'impresora',M:IMP,ask:n=>({kind:'vector',q:'Resolvé M0 + f·C = (2 0 0 0).',labels:tlab(n),sol:'none',check:v=>v==='none',show:()=>'que no tiene solución',why:'p1 da a = 0, p2 da b = 0, y entonces p3 da 1, no 0.',hint:'Buscá una contradicción usando p1, p2 y p3.',alt:{l:'No tiene solución',v:'none'},markErr(){},fillSol(){}})},
 {h:'Tener solución no alcanza',t:`<p>Si no hay solución, seguro no se llega. Si la hay, <b>todavía hay que comprobarlo</b>: es una condición necesaria, pero no suficiente.</p><p>Ejemplo: en la alcancía con todas las plazas vacías, <code>f = (1 1)</code> da como resultado <code>(0 0 1)</code>. Pero sin fichas no se puede disparar nada.</p><p>Por eso, cuando te dé un f, buscá un orden real de disparos.</p>`}
]}
]},
{b:'Listo para el parcial',l:[
{id:'x1',t:'Cómo resolver un ejercicio completo',pr:{ex:1},s:[
 {h:'El orden',net:'cinco',M:[1,0,0,0,0],t:`<ol><li>Hacé la tabla de qué saca y qué pone cada transición.</li><li>Armá el árbol por niveles, marcando duplicados, muertos y ω.</li><li>Pasalo a máquina de testigos, si la red es limitada.</li><li>Respondé las propiedades mirando el árbol o la máquina.</li><li>Armá C<sup>−</sup>, C<sup>+</sup> y C.</li><li>Calculá lo que pidan con matrices y comparalo con un marcado del árbol.</li></ol>`},
 {h:'Propiedades de esta red',net:'cinco',mt:9,t:`<ul><li><b>Limitación:</b> 1-limitada, sin ω.</li><li><b>Viva:</b> sí, no hay muertos y se puede disparar todo.</li><li><b>Cíclica:</b> sí.</li><li><b>Conservación estricta:</b> no, los totales son 1, 2, 2, 2, 2.</li><li><b>Con pesos:</b> sí, con <code>w = (2 1 1 1 1)</code>.</li><li><b>Conflicto estructural:</b> en p4.</li><li><b>Conflicto efectivo:</b> t4 y t5 en <code>00011</code>.</li><li><b>Exclusión mutua:</b> p2 con p4, y p3 con p5.</li></ul>`},
 {h:'Matrices de esta red',net:'cinco',t:n=>`<p>Matriz de incidencia C:</p>${mx(n,n.C)}<p>Control final: <code>t1 t2 t3</code> tiene <code>f = (1 1 1 0 0)</code>, y <code>M0 + f·C = (0 0 0 1 1)</code>, que está en el árbol.</p>`},
 {h:'Errores comunes',t:`<ul><li>Sacar las ramas de un marcado encadenadas, en vez de desde el mismo marcado.</li><li>Olvidarse el peso de una flecha.</li><li>Cortar por duplicado solo si está arriba en la misma rama: vale en cualquier parte del árbol.</li><li>Poner ω sin comprobar que habilita lo mismo.</li><li>Invertir filas y columnas de las matrices.</li><li>Confundir conflicto con concurrencia.</li><li>Creer que tener solución en la ecuación ya prueba que se puede llegar.</li></ul>`}
]},
{id:'x2',t:'La teoría que puede caer',pr:{teo:1},s:[
 {h:'Origen',t:`<p>Las redes de Petri surgen en 1962 con el trabajo doctoral de <b>Carl Adam Petri</b>, "Kommunikation mit Automaten". En 1970, Holt y Commoner, en "Events and Conditions", muestran cómo aplicarlas a sistemas con componentes concurrentes.</p><p>Son representaciones gráficas para modelar sistemas con flujo de información, y permiten representar concurrencia y hacer modelado matemático.</p>`},
 {h:'Ventajas',t:`<ul><li>Son gráficas y fáciles de interpretar.</li><li>Permiten tratar procesos independientes por separado.</li><li>Modelan con más exactitud que los diagramas de estados en problemas complejos.</li><li>Modelan recursos compartidos.</li><li>Se pueden sintetizar bottom-up o top-down.</li><li>Modelan procesos concurrentes.</li></ul>`},
 {h:'Desventajas',t:`<ul><li>Las redes generales no modelan ciertas situaciones de prioridad.</li><li>El análisis se complica según la complejidad del sistema.</li><li>A mayor alcance, crecen mucho el tiempo y el espacio.</li><li>Hay muchas subclases, creadas para problemas específicos.</li></ul>`},
 {h:'Aplicaciones',t:`<ul><li>Sistemas en tiempo real.</li><li>Sistemas operativos y compiladores.</li><li>Hardware y software.</li><li>Ambientes industriales de producción.</li><li>Diagramas de flujo de datos.</li><li>Protocolos de comunicación.</li><li>Bases de datos.</li></ul>`},
 {h:'Métodos de análisis',t:`<p><b>Árbol de alcanzabilidad:</b> da información detallada del comportamiento, pero puede volverse grande e inmanejable.</p><p><b>Matricial:</b> es compacto, pero C sola no refleja toda la estructura, f no da el orden, y tener solución es necesario pero no suficiente.</p>`}
]}
]}
];
const LECS=CURSO.flatMap(b=>b.l);
const AYUDA={
 disparo:['hab','<ol><li>Habilitada: cada entrada tiene al menos las fichas que pide su flecha.</li><li>Disparar: restás en las entradas y sumás en las salidas, según el peso.</li></ol>'],
 arbol:['arb1','<ol><li>Mirá qué habilita el marcado.</li><li>Dispará cada una desde ese mismo marcado.</li><li>Revisá el resultado: ¿ya apareció? Duplicado. ¿Tiene más fichas que un antepasado y habilita lo mismo? ω. ¿No habilita nada? Muerto. Si no, seguís.</li></ol>'],
 mt:['mt1','<ol><li>Un estado se escribe con las plazas que tienen fichas, repetidas según la cantidad.</li><li>Cada estado se dibuja una sola vez; los duplicados son flechas que vuelven.</li></ol>'],
 props:['p1','<ul><li>Limitación: mayor número del árbol.</li><li>Viva: toda transición puede volver a habilitarse.</li><li>Cíclica: siempre se puede volver a M0.</li><li>Conflicto estructural: una plaza con varias salidas.</li><li>Exclusión mutua: dos plazas nunca marcadas juntas.</li></ul>'],
 matriz:['f2','<ul><li>Filas: transiciones. Columnas: plazas.</li><li>C<sup>−</sup> saca, C<sup>+</sup> pone, C = C<sup>+</sup> − C<sup>−</sup>.</li><li>Habilitada: M ≥ fila de C<sup>−</sup>.</li><li>Disparo: M + fila de C.</li><li>Secuencia: M0 + f·C.</li></ul>']
};
const BACK={};
function revealTree(k){
 const root=RUN.an.tree;(function r(x){x.shown=false;x.pending=false;x.kids.forEach(r);})(root);root.shown=true;
 let c=0;const q=[root];
 while(q.length){const x=q.shift();for(const y of x.kids){if(c>=k)return root;c++;y.shown=true;q.push(y);}}
 return root;
}
function lessonFig(st){
 const R=RUN,red=$('.red'),play=$('.play');
 if(st.net){
  red.hidden=false;play.classList.remove('solo');
  const d=NETS.find(x=>x.id===st.net);
  if(R.netId!==st.net||R.playing||st.play){
   R.n=mkNet(d);R.an=analyze(R.n);R.netId=st.net;
   if(st.play){
    let M=R.n.m0.slice(),busy=false;
    const draw=()=>{paint(R.view,M);R.view.bars.forEach((b,j)=>b.setAttribute('class','bar'+(enOne(R.n,M,j)?' hab':'')));setM(M,'Marcado actual');};
    R.view=drawNet(R.n,$('#net'),async j=>{if(busy||!enOne(R.n,M,j))return;busy=true;const e=EPOCH,to=fire(R.n,M,j);await animFire(R.view,j,M,to);if(e!==EPOCH)return;M=to;draw();busy=false;});
    draw();R.playing=true;$('#ml').textContent='Marcado actual';$('#st').textContent='';
   }else{R.view=drawNet(R.n,$('#net'));R.playing=false;}
  }
  if(!st.play){setM(st.M||R.n.m0,st.M?'Marcado':'Marcado inicial M0');$('#st').textContent='';}
 }else{red.hidden=true;play.classList.add('solo');R.netId=null;}
 const parts=[];
 if(st.tree!==undefined)parts.push('t');if(st.mt!==undefined)parts.push('m');
 const e=$('#extra');
 if(!parts.length){e.hidden=true;e.innerHTML='';return;}
 e.hidden=false;
 e.innerHTML=(st.tree!==undefined?'<h4>Árbol de alcanzabilidad</h4><div class="scroll" id="ex-t"></div>':'')+(st.mt!==undefined?'<h4>Máquina de testigos</h4><div class="scroll" id="ex-m"></div>':'');
 if(st.tree!==undefined){const root=revealTree(st.tree);drawTree($('#ex-t'),root,null);}
 if(st.mt!==undefined){const done=R.an.edges.slice(0,st.mt),seen=new Set([0]);done.forEach(x=>seen.add(x.to));drawMT($('#ex-m'),seen,done);}
}
function navStep(st,k,total){
 return new Promise(res=>{
  CUR=null;
  const box=$('#task');
  if(!REDUCED)box.animate([{opacity:.35},{opacity:1}],{duration:170});
  box.scrollTop=0;
  box.innerHTML=`<h3>${st.h||''}</h3><div class="lec">${typeof st.t==='function'?st.t(RUN.n):st.t}</div><div class="acc">${k?'<button class="sec" id="prev">Atrás</button>':''}<button class="pri" id="next">${k===total-1?'Terminar lección':'Siguiente'}</button></div>`;
  $('#next').onclick=()=>res(1);if(k)$('#prev').onclick=()=>res(-1);
  if(FINE)$('#next').focus({preventScroll:true});
 });
}
async function lesson(i){
 exitRun();
 const L=LECS[i];
 ruta('#leccion-'+L.id);
 RUN={n:mkNet(NETS[0]),an:null,mode:'leccion',list:L.s,st:'leccion',pts:0,streak:0,total:0,first:0,t0:Date.now(),idx:0};
 renderPlay();
 $('.car').classList.add('enl');document.querySelectorAll('.car .ancho small')[1].textContent='Avance';$('.car .ancho b').innerHTML=L.t;$('.car .ancho small').textContent='Lección '+(i+1);
 const R=RUN;let k=0;
 while(k<L.s.length){
  R.idx=k;updHud();
  const st=L.s[k];lessonFig(st);window.scrollTo(0,0);
  if(st.ask){
   const it=st.ask(R.n);if(st.t)it.note=typeof st.t==='function'?st.t(R.n):st.t;it.canBack=k>0;
   const v=await ask(it);
   k+=v===BACK?-1:1;
  }else k+=await navStep(st,k,L.s.length);
 }
 lessonEnd(i);
}
function lessonEnd(i){
 const R=RUN,L=LECS[i],nx=LECS[i+1];
 SAVE.done[L.id]=true;SAVE.pts+=R.pts;store();
 CUR=null;EPOCH++;RUN=null;window.scrollTo(0,0);
 $('#app').innerHTML=`<section class="fin"><h2>Lección terminada</h2><p>Terminaste <b>${L.t}</b>.</p>
 ${R.total?`<dl><dt>Aciertos a la primera</dt><dd>${R.first} de ${R.total}</dd><dt>Puntos</dt><dd>${R.pts}</dd></dl>`:''}
 <div class="acc">${nx?`<button class="pri" id="nx">Seguir con: ${nx.t}</button>`:''}${L.pr?`<button class="${nx?'sec':'pri'}" id="pr">${L.pr.ex?'Hacer un simulacro':L.pr.teo?'Practicar teoría':'Practicar lo que aprendiste'}</button>`:''}<button class="sec" id="menu">Volver al inicio</button></div></section>`;
 $('#menu').onclick=()=>irInicio();
 if(nx)$('#nx').onclick=()=>lesson(i+1);
 if(L.pr)$('#pr').onclick=()=>{if(L.pr.ex)start(randNet(8),'examen');else if(L.pr.teo)teoria();else{FOCO=L.pr.st;start(mkNet(NETS.find(d=>d.id===L.pr.net)),'nivel');}};
}

enrutar();
</script>
